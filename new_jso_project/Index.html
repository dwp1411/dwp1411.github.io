      // Signature Pad Logic
      let canvas, ctx;
      let drawing = false;
      let signatureEmpty = true;

      function initSignature() {
          canvas = document.getElementById('signaturePad');
          if (!canvas) return;
          ctx = canvas.getContext('2d');

          canvas.addEventListener('mousedown', startDrawing);
          canvas.addEventListener('mousemove', draw);
          canvas.addEventListener('mouseup', stopDrawing);
          canvas.addEventListener('mouseout', stopDrawing);

          // Touch support for mobile
          canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            startDrawing(e.touches[0]);
          }, {passive: false});
          canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            draw(e.touches[0]);
          }, {passive: false});
          canvas.addEventListener('touchend', stopDrawing);
      }

      function startDrawing(e) {
          drawing = true;
          signatureEmpty = false;
          draw(e);
      }

      function draw(e) {
          if (!drawing) return;
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#000';

          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x, y);
      }

      function stopDrawing() {
          drawing = false;
          ctx.beginPath();
      }

      function clearSignature() {
          if(!canvas) return;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          signatureEmpty = true;
      }


      // Speech Recognition
      let recognition;
      let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechRecognition) {
          recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
      }

      function startVoiceRecognition(targetId, btn) {
          if (!recognition) {
              alert("Voice to text API is not supported in this browser. Please use the microphone button on your phone's native keyboard to dictate.");
              return;
          }

          const targetInput = document.getElementById(targetId);
          const originalText = btn.innerHTML;

          recognition.onstart = function() {
              btn.innerHTML = '🔴';
              btn.style.color = 'red';
          };

          recognition.onresult = function(event) {
              const transcript = event.results[0][0].transcript;
              if (targetInput.value) {
                 targetInput.value += ' ' + transcript;
              } else {
                 targetInput.value = transcript;
              }
          };

          recognition.onerror = function(event) {
              console.error("Speech error", event.error);
              alert("Microphone error: " + event.error);
              btn.innerHTML = originalText;
              btn.style.color = '';
          };

          recognition.onend = function() {
              btn.innerHTML = originalText;
              btn.style.color = '';
          };

          recognition.start();
      }

           return;
        }


        const leaders = Object.keys(staffHierarchy).sort();
        leaders.forEach(leader => {
          const option1 = document.createElement('option');
          option1.value = leader;
          option1.textContent = leader;
          globalLeaderSelect.appendChild(option1);


          const option2 = document.createElement('option');
          option2.value = leader;
          option2.textContent = leader;
          if(jsoLeaderSelect) jsoLeaderSelect.appendChild(option2);
        });
      }


      function updateAssociates(leaderId, assocId) {
        const leaderSelect = document.getElementById(leaderId);
        const associateSelect = document.getElementById(assocId);
        const selectedLeader = leaderSelect.value;

        associateSelect.innerHTML = '<option value="" disabled selected>Select an Associate...</option>';

        if (selectedLeader && staffHierarchy[selectedLeader]) {
          const associates = staffHierarchy[selectedLeader];
          associates.forEach(associate => {
            const option = document.createElement('option');
            option.value = associate;
            option.textContent = associate;
            associateSelect.appendChild(option);
          });
          associateSelect.disabled = false;
        } else {
          associateSelect.disabled = true;
          associateSelect.innerHTML = '<option value="" disabled selected>First select a Leader</option>';
        }
      }


      // Navigation Logic
      function hideAllViews() {
          document.getElementById('landing-view').style.display = 'none';
          document.getElementById('jso-tracking-view').style.display = 'none';
          document.getElementById('jso-notes-view').style.display = 'none';
          document.getElementById('conversations-view').style.display = 'none';
          document.getElementById('messageArea').style.display = 'none';
      }


      function selectPath(path) {
          hideAllViews();
          document.getElementById(path + '-view').style.display = 'block';
      }

      function goBack(viewId) {
          hideAllViews();
          document.getElementById(viewId).style.display = 'block';
      }


      function goToJsoNotes() {
          const func = document.getElementById('jso-function').value;
          if (!func) {
              const msg = document.getElementById('messageArea');
              msg.textContent = "Please select a Function.";
              msg.className = "message error";
              msg.style.display = "block";
              return;
          }


          stopTimer();
          hideAllViews();
          document.getElementById('jso-notes-view').style.display = 'block';
          setTimeout(initSignature, 100); // init after display is block
      }


      // Timer & JSO Logic
      function handleFunctionSelect() {
        const select = document.getElementById('jso-function');
        const selectedOpt = select.options[select.selectedIndex];

        if (selectedOpt.value) {
            const uph = selectedOpt.getAttribute('data-uph');
            currentFunctionType = selectedOpt.getAttribute('data-type');

            document.getElementById('uph-value').innerText = uph;
            document.getElementById('uph-display').style.display = 'block';
            document.getElementById('startTimerBtn').style.display = 'inline-block';
            renderDynamicChecklist(selectedOpt.value);
        }
      }


      function updateTimerDisplay() {
          const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
          const secs = (seconds % 60).toString().padStart(2, '0');
          document.getElementById('stopwatch').textContent = `${mins}:${secs}`;
      }


      function startTimer() {
          const func = document.getElementById('jso-function').value;
          if(!func) return;

          isTimerRunning = true;
          document.getElementById('startTimerBtn').style.display = 'none';
          document.getElementById('stopTimerBtn').disabled = false;
          document.getElementById('jso-function').disabled = true;

          document.getElementById('action-logging-area').style.display = 'block';
          if(currentFunctionType === 'pallet') {
              document.getElementById('pallet-movement-area').style.display = 'block';
              document.getElementById('piece-picking-area').style.display = 'none';
          } else {
              document.getElementById('pallet-movement-area').style.display = 'none';
              document.getElementById('piece-picking-area').style.display = 'block';
          }


          timerInterval = setInterval(() => {
              seconds++;
              updateTimerDisplay();
          }, 1000);
      }


      function formatTime(s) {
          const mins = Math.floor(s / 60).toString().padStart(2, '0');
          const secs = (s % 60).toString().padStart(2, '0');
          return `${mins}:${secs}`;
      }


      function logPalletMovement() {
          const startSeconds = lastLogSeconds;
          const diffSeconds = seconds - lastLogSeconds;
          lastLogSeconds = seconds;

          totalCount++; trackingLogs.push({
             type: 'Pallet Movement',
             startTime: formatTime(startSeconds),
             time: formatTime(seconds),
             timeSinceLast: formatTime(diffSeconds),
             durationSeconds: diffSeconds
          });

          document.getElementById('last-log-msg').textContent = `Logged movement at ${formatTime(seconds)} (${formatTime(diffSeconds)} since last log).`;
      }


      function logPiecesPicked() {
          const piecesInput = document.getElementById('pieces-picked');
          const count = parseInt(piecesInput.value, 10);

          if(isNaN(count) || count <= 0) return;

          const startSeconds = lastLogSeconds;
          const diffSeconds = seconds - lastLogSeconds;
          lastLogSeconds = seconds;

          totalCount += count; trackingLogs.push({
             type: 'Pieces Picked',
             count: count,
             startTime: formatTime(startSeconds),
             time: formatTime(seconds),
             timeSinceLast: formatTime(diffSeconds),
             durationSeconds: diffSeconds
          });

          document.getElementById('last-log-msg').textContent = `Logged ${count} pieces at ${formatTime(seconds)} (${formatTime(diffSeconds)} since last log).`;
          piecesInput.value = '';
      }


      function stopTimer() {
          isTimerRunning = false;
          document.getElementById('stopTimerBtn').disabled = true;
          document.getElementById('action-logging-area').style.display = 'none';
          clearInterval(timerInterval);
      }


      function showInitError(error) {
        document.getElementById('loading-area').style.display = 'none';
        const msg = document.getElementById('messageArea');
        msg.textContent = "Error loading staff data: " + error.message;
        msg.className = "message error";
        msg.style.display = "block";
      }


      // SUBMISSIONS


      // 1. Conversations Form Submission
      document.getElementById('jsoForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('messageArea');

        const topic = document.getElementById('topic').value;
        const leader = document.getElementById('conv-leader').value;
        const associate = document.getElementById('conv-assoc').value;
        const typePositive = document.getElementById('type-positive').checked;
        const notes = document.getElementById('notes').value;


        const type = typePositive ? 'Positive' : 'Negative';


        const data = {
          topic: topic,
          leader: leader,
          associate: associate,
          type: type,
          notes: notes
        };


        btn.disabled = true;
        btn.innerHTML = '<span id="loader"></span> Submitting...';
        msg.style.display = "none";


        google.script.run
          .withSuccessHandler(() => {
              onSuccess('jsoForm', 'submitBtn', 'Observation successfully recorded!');
          })
          .withFailureHandler((err) => onError(err, 'submitBtn', 'Submit Observation'))
          .submitObservation(data);
      });


      // 2. JSO PDF Form Submission
      document.getElementById('jsoPdfForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitPdfBtn');
        const msg = document.getElementById('messageArea');

        const leader = document.getElementById('jso-leader').value;
        const associate = document.getElementById('jso-associate').value;
        const func = document.getElementById('jso-function').value;

        let formattedLogs = trackingLogs.map(log => {
            if(log.type === 'Pallet Movement') {
                return `<li>Movement at ${log.time} (Time since last: ${log.timeSinceLast})</li>`;
            } else {
                return `<li>Picked ${log.count} pieces at ${log.time} (Time since last: ${log.timeSinceLast})</li>`;
            }
        }).join('');


        if (trackingLogs.length === 0) formattedLogs = "<li>No activities logged.</li>";


        const uphData = document.getElementById('uph-value').textContent;






        const checklistResults = [];
        document.querySelectorAll('.dynamic-check-item').forEach(item => {
            const label = item.querySelector('label');
            const noteArea = item.querySelector('.dynamic-notes');
            if (label) {
               checklistResults.push({
                   check: label.getAttribute('data-label'),
                   passed: true, // Assuming passed if not checked (since there's no checkbox)
                   notes: noteArea.value
               });
            }
        });

        const fbPace = document.querySelector('input[name="fb-pace"]:checked')?.value || "N/A";
        const fbSkills = document.querySelector('input[name="fb-skills"]:checked')?.value || "N/A";
        const fbTraining = document.querySelector('input[name="fb-training"]:checked')?.value || "N/A";
        const fbEnvironment = document.querySelector('input[name="fb-environment"]:checked')?.value || "N/A";
        const fbNotes = document.getElementById('fb-notes').value || "None";
        const signatureBase64 = typeof signatureEmpty !== 'undefined' && !signatureEmpty && typeof canvas !== 'undefined' && canvas ? canvas.toDataURL("image/png") : null;

        // Generate a shared ID or timestamp client-side to ensure the links match exactly
        const sharedTimestamp = new Date().toISOString();

        const summaryRow = {
            sharedTimestamp: sharedTimestamp, // new field to link
            leader: leader,
            associate: associate,
            duration: document.getElementById('stopwatch').textContent,
            checklistResults: checklistResults,
            function: func,
            type: currentFunctionType,
            totalCount: totalCount,
            totalSeconds: seconds,
            activityLogs: formattedLogs,
            fbPace: fbPace,
            fbSkills: fbSkills,
            fbTraining: fbTraining,
            fbEnvironment: fbEnvironment,
            fbNotes: fbNotes,
            signature: signatureBase64
        };

        const currentDate = new Date().toLocaleDateString();
        const movementLogs = trackingLogs.map(log => ({
            date: currentDate,
            associate: associate,
            function: func,
            sharedTimestamp: sharedTimestamp,
            actionName: log.type,
            startTime: log.startTime,
            endTime: log.time,
            durationSeconds: log.durationSeconds,
            count: log.count || 1
        }));

        const data = {
            summaryRow: summaryRow,
            movementLogs: movementLogs
        };


        btn.disabled = true;
        btn.innerHTML = '<span id="loader"></span> Submitting...';


        google.script.run
          .withSuccessHandler(() => {
              onSuccess('jsoPdfForm', 'submitPdfBtn', 'JSO Report generated and emailed successfully!');
          })
          .withFailureHandler((err) => onError(err, 'submitPdfBtn', 'Submit & Send PDF'))
          .processJSO(data); // <--- Using the new PDF function from earlier
      });


      // 3. Direct Link CCA / Coaching Submission
      document.getElementById('ccaFormRecord').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitCoachBtn');
        const msg = document.getElementById('messageArea');

        const data = {
          id: document.getElementById('observationId').value,
          policy: document.getElementById('policyViolated').value,
          perspective: document.getElementById('associatePerspective').value,
          actionPlan: document.getElementById('actionPlan').value,
          leaderNotes: document.getElementById('leaderNotes').value
        };


        btn.disabled = true;
        btn.innerHTML = '<span id="loader"></span> Submitting...';


        google.script.run
          .withSuccessHandler(function() {
             document.getElementById('coachingForm').reset();
             document.getElementById('coachingForm').style.display = 'none';
             msg.textContent = "Coaching record successfully saved! You may close this tab.";
             msg.className = "message success";
             msg.style.display = "block";
          })
          .withFailureHandler(function(error) {
             btn.disabled = false;
             btn.textContent = 'Submit Coaching Record';
             msg.textContent = error.message || "An error occurred.";
             msg.className = "message error";
             msg.style.display = "block";
          })
          .submitCoaching(data);
      });


      // Utilities
      function onSuccess(formId, btnId, successMsg) {
        const btn = document.getElementById(btnId);
        const msg = document.getElementById('messageArea');
        document.getElementById(formId).reset();

        btn.disabled = false;
        btn.textContent = btnId === 'submitPdfBtn' ? 'Submit & Send PDF' : 'Submit Observation';

        msg.textContent = successMsg;
        msg.className = "message success";

        // Reset tracking vars for JSO if applicable
        if (formId === 'jsoPdfForm') {
            trackingLogs = [];
            totalCount = 0;
            document.getElementById('uph-display').style.display = 'none';
            document.getElementById('startTimerBtn').style.display = 'inline-block';
            document.getElementById('stopTimerBtn').disabled = true;
            document.getElementById('jso-function').disabled = false;
            document.getElementById('action-logging-area').style.display = 'none';
            document.getElementById('stopwatch').textContent = "00:00";
            if (typeof clearSignature === "function") clearSignature();
        }

        // Route back to landing
        goBack('landing-view');
        msg.style.display = "block"; // Re-show since hideAllViews hides it

        setTimeout(() => { msg.style.display = "none"; }, 4000);
      }


      function onError(error, btnId, defaultText) {
        const btn = document.getElementById(btnId);
        const msg = document.getElementById('messageArea');

        btn.disabled = false;
        btn.textContent = defaultText;

        msg.textContent = "Error: " + error.message;
        msg.className = "message error";
        msg.style.display = "block";
      }
    </script>
  </body>
</html>
